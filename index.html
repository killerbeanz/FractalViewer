<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crescent Moon Fractal</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gpu-canvas"></canvas>

  <div class="panel" id="panel">
    <div class="field-row">
      <label for="center-x">center re</label>
      <input id="center-x" type="number" step="0.01" value="0" />
    </div>

    <div class="field-row">
      <label for="center-y">center im</label>
      <input id="center-y" type="number" step="0.01" value="0" />
    </div>

    <div class="field-row">
      <label for="scale">view scale</label>
      <input id="scale" type="number" step="0.1" value="2.5" />
    </div>

    <div class="divider"></div>

    <div class="hint">-1 for unlimited iterations</div>

    <div class="field-row">
      <label for="max-iter">max iterations</label>
      <input id="max-iter" type="number" step="1" value="20000" />
    </div>

    <div class="field-row">
      <label for="resolution">resolution</label>
      <select id="resolution">
        <option value="0.5">Low (0.5×)</option>
        <option value="0.75">Medium (0.75×)</option>
        <option value="1" selected>Full (1×)</option>
      </select>
    </div>

    <div class="button-row">
      <button id="recompute-btn">Recompute</button>
      <button id="reset-view-btn" class="secondary">Reset view</button>
    </div>

    <div class="divider"></div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>

    <div class="readout" id="progress-label">0.0%</div>
    <div class="readout status" id="status-text">Starting…</div>

    <p class="hint">Drag to pan · scroll to zoom</p>
  </div>

  <button id="gradient-tab" class="gradient-tab">Gradient</button>

  <div id="gradient-editor" class="gradient-editor">
    <div class="gradient-editor-header">
      <span>Gradient</span>
      <button id="gradient-close" class="gradient-close">×</button>
    </div>

    <canvas id="gradient-preview" width="260" height="260"></canvas>

    <div class="gradient-controls">
      <div class="field-row">
        <label for="gradient-algorithm">algorithm</label>
        <select id="gradient-algorithm">
          <option value="linear">Linear</option>
          <option value="smoothstep">Smoothstep</option>
          <option value="smootherstep">Smootherstep</option>
          <option value="cosine">Cosine</option>
        </select>
      </div>

      <div class="field-row">
        <label for="gradient-length">gradient length</label>
        <input
          id="gradient-length"
          type="number"
          min="1"
          step="1"
          value="1000"
        />
      </div>
    </div>

    <div class="gradient-stops-header">
      <span>colors</span>
      <button id="gradient-add-stop">+ Add</button>
    </div>

    <div id="gradient-stops"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
