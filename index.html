<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>z^(1/z) — Power Tower Explorer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gpu-canvas"></canvas>

  <div class="panel" id="panel">
    <div class="panel-header">
      <span class="eyebrow">Power tower</span>
      <h1>a<sub>n+1</sub> = base<sup>aₙ</sup>, base = z<sup>1/z</sup></h1>
    </div>

    <div class="field-row">
      <label for="center-x">center re</label>
      <input id="center-x" type="number" step="0.01" value="0" />
    </div>
    <div class="field-row">
      <label for="center-y">center im</label>
      <input id="center-y" type="number" step="0.01" value="0" />
    </div>
    <div class="field-row">
      <label for="scale">view scale</label>
      <input id="scale" type="number" step="0.1" value="2.5" />
    </div>

    <div class="divider"></div>

    <div class="field-row">
      <label for="max-iter">max iterations</label>
      <input id="max-iter" type="number" step="1000" value="20000" />
    </div>
    <div class="field-row">
      <label for="resolution">resolution</label>
      <select id="resolution">
        <option value="0.5">Low (0.5×)</option>
        <option value="0.75">Medium (0.75×)</option>
        <option value="1" selected>Full (1×)</option>
      </select>
    </div>

    <div class="button-row">
      <button id="recompute-btn">Recompute</button>
      <button id="reset-view-btn" class="secondary">Reset view</button>
    </div>

    <div class="divider"></div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="readout" id="progress-label">0.0%</div>
    <div class="readout status" id="status-text">Starting…</div>

    <div class="legend">
      <div class="legend-item"><span class="swatch swatch-black"></span> periodic / out of domain</div>
      <div class="legend-item"><span class="swatch swatch-gradient"></span> diverged, by speed</div>
      <div class="legend-item"><span class="swatch swatch-gray"></span> unresolved at cap</div>
    </div>

    <p class="hint">Drag to pan · scroll to zoom</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
